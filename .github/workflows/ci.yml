name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI never uses production secrets. It runs against a throwaway Postgres service
# container provisioned for the job. No seed credentials are set: the suite
# creates its own users, and the seed job is exercised by unit tests that assert
# it refuses unsafe configuration.
env:
  DATABASE_URL: postgres://relay:relay@localhost:5432/relay_test
  BASE_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `postinstall` regenerates the Prisma client from prisma/schema, which is
      # why the generated client is not committed.
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations (test database)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate OpenAPI spec
        run: npm run api:check

      - name: Check translation completeness
        run: npm run i18n:check

      - name: Check documentation links
        run: npm run docs:check

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build

      # Test output is only useful when something failed.
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: |
            coverage/
            .next/trace
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Browser smoke test (Playwright)
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://relay:relay@localhost:5432/relay_e2e
      BASE_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      E2E: '1'
      # The dev server is started by Playwright's webServer block.
      E2E_NO_SERVER: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations (test database)
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
