name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI never uses production secrets. It runs against a throwaway Postgres
# service container provisioned for the job.
env:
  DATABASE_URL: postgres://relay:relay@localhost:5432/relay_test
  BASE_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
  ROOT_EMAIL: admin@relay.com
  ROOT_PASSWORD: rootroot
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build
